name: Compilar Mazmorra del Umbral

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar mod Forge
        run: gradle build --no-daemon
      - name: Mostrar JAR generado
        run: find build/libs -maxdepth 1 -type f -name '*.jar' -printf '%f\n'
      - name: Guardar JAR compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mazmorra-umbral-fase1
          path: build/libs/*-1.0-fase1.jar
          if-no-files-found: error
          retention-days: 14
