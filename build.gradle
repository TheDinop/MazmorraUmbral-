plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.mazmorraumbral'
version = '1.0-fase1'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                mazmorra_umbral {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {}
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.5'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'mazmorra_umbral',
            'Specification-Vendor': 'mazmorraumbral',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}

// ForgeGradle reobfuscates the production jar for Minecraft's runtime names.
jar.finalizedBy('reobfJar')
